name: Godot parse and smoke test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and validate project
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Headless startup smoke test
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 20
      - name: Direct manipulation integration test
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_touch_drag.gd
      - name: BBModel import integration test
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_bbmodel_import.gd 2>&1 | tee /tmp/bbmodel-test.log
          grep -F "BBMODEL TEST PASSED" /tmp/bbmodel-test.log
      - name: Blockbench polygon mesh regression test
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_free_mesh_bbmodel.gd 2>&1 | tee /tmp/mesh-test.log
          grep -F "FREE MESH TEST PASSED" /tmp/mesh-test.log
      - name: Blockbench bone rotation order integration test
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_bbmodel_bone_rotation.gd 2>&1 | tee /tmp/bone-rotation-test.log
          grep -F "BONE ROTATION TEST PASSED" /tmp/bone-rotation-test.log
      - name: Mobile portrait UI and touch focus regression
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_mobile_ui_stability.gd 2>&1 | tee /tmp/mobile-ui-test.log
          grep -F "MOBILE UI TEST PASSED" /tmp/mobile-ui-test.log
      - name: Cutscene timeline clip and camera integration
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_cutscene_timeline.gd 2>&1 | tee /tmp/cutscene-test.log
          grep -F "CUTSCENE TEST PASSED" /tmp/cutscene-test.log
      - name: Touch hierarchy and transform-gizmo regression
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_part_editor.gd 2>&1 | tee /tmp/part-editor-test.log
          grep -F "PART EDITOR TEST PASSED" /tmp/part-editor-test.log
      - name: Model and joint gizmo follow regression
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_gizmo_follow.gd 2>&1 | tee /tmp/gizmo-follow-test.log
          grep -F "GIZMO FOLLOW TEST PASSED" /tmp/gizmo-follow-test.log
      - name: Independent joint pose keyframe and history integration
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_pose_timeline.gd 2>&1 | tee /tmp/pose-timeline-test.log
          grep -F "POSE TIMELINE TEST PASSED" /tmp/pose-timeline-test.log
      - name: Android portrait usability audit
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_usability_audit.gd 2>&1 | tee /tmp/usability-audit.log
          grep -F "UX_AUDIT_FINISHED" /tmp/usability-audit.log
      - name: Strict Android portrait UX regression
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_ux_fixes.gd 2>&1 | tee /tmp/ux-fixes.log
          grep -F "UX FIX TEST PASSED" /tmp/ux-fixes.log
